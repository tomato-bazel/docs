name: docs

# Build the docs.tbzl.dev site (Astro + Pagefind full-text search) and publish to
# GitHub Pages. Two references are regenerated from upstream on each build, so
# they never drift from what is actually published:
#
#   src/data/modules.json      the registry — newly-published modules appear
#                              without a code change.
#   src/data/conformance.json  the gate report — /conformance/ and the per-module
#                              findings on each reference page.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "tools/**"
      - ".github/workflows/docs.yml"
  schedule:
    - cron: "17 7 * * *"   # nightly — pick up newly-published registry modules
    - cron: "30 10 * * 1"  # Monday, ~90min after gate's weekly conformance run
                           # (0 9 * * 1) — comfortable margin for its Bazel
                           # build. This is a PULL on purpose: a push from gate
                           # would need a cross-repo PAT held as a secret there,
                           # and for a weekly artifact that buys a few hours at
                           # the cost of a credential to rotate. The nightly
                           # covers it either way.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: regenerate the module reference from the registry + repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 https://github.com/tomato-bazel/bazel-registry .registry
          python3 tools/gen_modules.py --registry .registry \
            --out src/data/modules.json --content src/content/moduledocs --fetch
          rm -rf .registry

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci

      # The conformance report, from tomato-bazel/gate's Pages. No credentials:
      # gate is public and publishes the report unauthenticated, the same reason
      # its own workflow needs no token.
      #
      # NOT soft-failed. A stale committed report would render as confident
      # current numbers, which is worse than a red build — and the report carries
      # its own generated_at so the page can say how old it is, but only if we
      # actually fetched it.
      #
      # ORDERING: this 404s until gate's conformance-report workflow has run at
      # least once against the proto-emitting //gates:report. Land the gate change
      # and `gh workflow run report.yml -R tomato-bazel/gate` BEFORE merging here,
      # or the first build on main goes red.
      - name: regenerate the conformance report
        run: node tools/gen_conformance.mjs --fetch

      - run: npm run build   # astro build && pagefind --site dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
